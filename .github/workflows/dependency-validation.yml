name: Dependency validation

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - tests/**
      - src/**
      - examples/**
      - tsconfig.json
      - vitest.config.ts
      - .github/workflows/dependency-validation.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - tests/**
      - src/**
      - examples/**
      - tsconfig.json
      - vitest.config.ts
      - .github/workflows/dependency-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local verification
        run: npm run check

      - name: Verify npm advisory state
        run: npm audit --audit-level=moderate
