name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/broken-component/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated fixture lockfile
        run: npm ci --ignore-scripts --prefix fixtures/broken-component

      - name: Build and test
        run: npm run check
